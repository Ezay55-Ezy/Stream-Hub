app = "streamgram-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "session_data"
  destination = "/app/artifacts/api-server"
  processes = ["app"]

[env]
  PORT = "8080"
  NODE_ENV = "production"
