services:
  - type: web
    name: streamgram-api
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
