name: streamgram-api
service:
  name: api
  instance_type: free
  ports:
    - port: 8080
      protocol: http
  health_check:
    path: /api/healthz
    port: 8080
  env:
    - key: PORT
      value: "8080"
    - key: NODE_ENV
      value: production
    - key: TELEGRAM_API_ID
      secret: true
    - key: TELEGRAM_API_HASH
      secret: true
    - key: DATABASE_URL
      secret: true
  routes:
    - path: /
      port: 8080
  scalings:
    min: 1
    max: 1
