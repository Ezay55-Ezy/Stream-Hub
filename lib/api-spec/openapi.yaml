openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StreamGram API - Telegram channel video streaming
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: series
    description: Series and video operations
  - name: categories
    description: Category operations
  - name: auth
    description: Telegram authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether the Telegram session is authenticated
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/send-code:
    post:
      operationId: sendAuthCode
      tags: [auth]
      summary: Send Telegram verification code to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneSendInput"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSendResult"
        "400":
          description: Bad request

  /auth/verify-code:
    post:
      operationId: verifyAuthCode
      tags: [auth]
      summary: Verify OTP code and establish a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneVerifyInput"
      responses:
        "200":
          description: Verified — session active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerifyResult"
        "400":
          description: Invalid code or request

  /series:
    get:
      operationId: listSeries
      tags: [series]
      summary: List all series
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"

  /series/featured:
    get:
      operationId: getFeaturedSeries
      tags: [series]
      summary: Get featured series for hero banner
      responses:
        "200":
          description: Featured series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "404":
          description: No series found

  /series/recent:
    get:
      operationId: getRecentSeries
      tags: [series]
      summary: Get recently added series
      responses:
        "200":
          description: Recently added series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"

  /series/sync:
    post:
      operationId: syncSavedMessages
      tags: [series]
      summary: Bulk-import video files from Telegram Saved Messages
      responses:
        "200":
          description: Sync complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "401":
          description: Not authenticated

  /series/{id}:
    get:
      operationId: getSeriesById
      tags: [series]
      summary: Get a single series by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Series detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "404":
          description: Not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories with series count
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    AuthStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        phone:
          type: ["string", "null"]

    PhoneSendInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    CodeSendResult:
      type: object
      required: [phoneCodeHash]
      properties:
        phoneCodeHash:
          type: string

    PhoneVerifyInput:
      type: object
      required: [phone, phoneCodeHash, code]
      properties:
        phone:
          type: string
        phoneCodeHash:
          type: string
        code:
          type: string

    AuthVerifyResult:
      type: object
      required: [session]
      properties:
        session:
          type: string

    SyncResult:
      type: object
      required: [added, total]
      properties:
        added:
          type: integer
        total:
          type: integer

    Series:
      type: object
      required: [id, title, posterUrl, downloadUrl, telegramFileId, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        posterUrl:
          type: string
        downloadUrl:
          type: string
        telegramFileId:
          type: string
        fileSize:
          type: ["integer", "null"]
        duration:
          type: ["integer", "null"]
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        createdAt:
          type: string

    Category:
      type: object
      required: [id, name, seriesCount]
      properties:
        id:
          type: integer
        name:
          type: string
        seriesCount:
          type: integer
